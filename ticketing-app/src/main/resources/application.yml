spring:
  application:
    name: ticketing-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_reservation}
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticket}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: Redis is an optimisation, never worth waiting for (ADR 003).
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
  flyway:
    enabled: true
    # Inventory's migrations (history in public.flyway_schema_history, kept for existing databases).
    # Booking (P3.1) and payment migrate their own schemas with their own history tables.
    locations: classpath:db/migration/inventory
inventory:
  expiry:
    # P2.1: cleanup of expired holds (availability does not depend on it, see lazy expiry P1.2).
    enabled: ${EXPIRY_ENABLED:true}
    interval: ${EXPIRY_INTERVAL:5s}
    batch-size: 500
    max-batches: 20
  seat-cache:
    # P2.3: seat maps from Redis, kept current from SeatsChanged events; falls back to Postgres.
    enabled: ${SEAT_CACHE_ENABLED:true}
    update-queue: 10000
  reconcile:
    # P2.5: repair Redis seat-cache drift from Postgres (Postgres wins).
    enabled: ${RECONCILE_ENABLED:true}
    interval: ${RECONCILE_INTERVAL:30s}
  fast-path:
    # P2.4: reject requests for seats the cache knows are taken before any database work (needs seat-cache).
    enabled: ${FAST_PATH_ENABLED:true}
  redis-breaker:
    # P2.6: how long Redis is skipped after the breaker opens before trial calls are allowed.
    wait-in-open: ${REDIS_BREAKER_WAIT:5s}
  locking:
    # conditional-update (default) | pessimistic | optimistic | redis-lock | redis-lua  (P1.7, ADR 003)
    strategy: ${LOCKING_STRATEGY:conditional-update}
payment:
  mock:
    # P4.1: the mock gateway. Checkout instruction RANDOM uses these rates; SUCCESS / DECLINE / TIMEOUT force an outcome.
    latency: ${PAYMENT_MOCK_LATENCY:300ms}
    decline-rate: ${PAYMENT_MOCK_DECLINE_RATE:0.1}
    timeout-rate: ${PAYMENT_MOCK_TIMEOUT_RATE:0.05}
    # P4.3: the mock provider's signed webhooks, delivered over HTTP after a delay, sometimes twice.
    webhook-delay: ${PAYMENT_MOCK_WEBHOOK_DELAY:500ms}
    duplicate-webhook-rate: ${PAYMENT_MOCK_DUPLICATE_WEBHOOK_RATE:0.2}
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:local-dev-webhook-secret}
management:
  health:
    redis:
      # Redis is only needed by the redis-* strategies today; it becomes part of health with P2.
      enabled: ${REDIS_HEALTH:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
