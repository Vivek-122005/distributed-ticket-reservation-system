spring:
  application:
    name: ticketing-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_reservation}
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticket}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: Redis is an optimisation, never worth waiting for (ADR 003).
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
  flyway:
    enabled: true
    # One folder per module. Tables live in per-module schemas (inventory.*, from V2); the shared
    # history table stays in public until booking gets its own migrations (P3.1).
    locations: classpath:db/migration/inventory
inventory:
  expiry:
    # P2.1: cleanup of expired holds (availability does not depend on it, see lazy expiry P1.2).
    enabled: ${EXPIRY_ENABLED:true}
    interval: ${EXPIRY_INTERVAL:5s}
    batch-size: 500
    max-batches: 20
  seat-cache:
    # P2.3: seat maps from Redis, kept current from SeatsChanged events; falls back to Postgres.
    enabled: ${SEAT_CACHE_ENABLED:true}
    update-queue: 10000
  locking:
    # conditional-update (default) | pessimistic | optimistic | redis-lock | redis-lua  (P1.7, ADR 003)
    strategy: ${LOCKING_STRATEGY:conditional-update}
management:
  health:
    redis:
      # Redis is only needed by the redis-* strategies today; it becomes part of health with P2.
      enabled: ${REDIS_HEALTH:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
