# Integration tests drive scheduled jobs explicitly so they never race with test setup.
inventory.expiry.enabled=false
# Tests without a Redis container read seat maps from Postgres; cache tests enable it explicitly.
inventory.seat-cache.enabled=false
inventory.reconcile.enabled=false
# The mock payment gateway answers instantly in tests; outcomes are chosen per request.
payment.mock.latency=0ms
# Mock webhooks arrive quickly and never twice by chance in tests (duplicates are sent explicitly).
payment.mock.webhook-delay=50ms
payment.mock.duplicate-webhook-rate=0
