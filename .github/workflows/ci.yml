name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Builds every module from the root parent POM, in dependency order.
      # 'verify' runs unit/architecture tests (*Test, surefire) and then the
      # Testcontainers integration tests (*IT, failsafe); ubuntu runners ship Docker.
      - run: mvn --batch-mode verify
